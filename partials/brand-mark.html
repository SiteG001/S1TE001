<!--
  White Oak Stewardship brand mark.

  A white oak leaf. Quercus alba is the oak with ROUNDED lobes; red and black
  oak lobes end in bristles. Building that into the silhouette is what makes
  this a white oak rather than a stock leaf, and it is the one botanical detail
  worth the geometry.

  Authored symmetrically about x=20 in a 40x40 box: the right half is drawn as
  cubics and the left half is the same control points reflected, so the two
  sides can never drift apart. The midrib and the four lateral veins are
  knockouts in a single even-odd path, which keeps the whole mark one colour.
  It inherits `currentColor`, inverts to gold over the dark hero, and shows the
  photograph through its veins on the OG cards. The 1.12 scale exists because a
  narrow upright leaf reads optically smaller than a square mark of the same
  height; it fills the box the way the old house mark did.

  Detail fails in the right direction: the veins disappear around 20px, the
  midrib softens, the silhouette survives. favicon.svg drops the veins outright
  and scripts/build-og-images.py redraws these same paths at 52px.
-->
